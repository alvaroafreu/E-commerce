<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hardware | Eleve seu setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
    <div class="header-container">
        <a class="logo" onclick="voltarParaLoja(event)"><i class="fa-solid fa-microchip"></i>Nexus<span>HW</span></a>
        <div class="search-bar">
            <i class="fa-solid fa-search" id="searchIcon"></i>
            <input type="text" id="searchInput" placeholder="Buscar placas de vídeo, processadores, periféricos...">
        </div>
        <div class="header-actions">
            <button class="action-icon"><i class="fa-regular fa-heart"></i></button>
            <button class="action-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cartCount">0</span>
            </button>
            <button class="action-icon" onclick="clicarPerfil()" title="Perfil"><i class="fa-regular fa-user"></i></button>
        </div>
    </div>
    <nav class="nav-categories" id="navCategoriesBar">
        <div class="categories-container" id="navCategoriesContainer">
            <button class="category-item active" data-category="Produtos"><i class="fa-solid fa-store"></i> Produtos</button>
            <button class="category-item" data-category="Hardware">Hardware</button>
            <button class="category-item" data-category="Placas de Vídeo">Placas de Vídeo</button>
            <button class="category-item" data-category="Periféricos">Periféricos</button>
            <button class="category-item" data-category="Processadores">Processadores</button>
            <button class="category-item" data-category="Memórias RAM">Memórias RAM</button>
        </div>
    </nav>
</header>

<!-- Modal de Autenticação -->
<div class="modal-overlay" id="authModal">
    <div class="modal-box">
        <div class="modal-tabs">
            <button class="modal-tab active" id="tabLoginBtn" onclick="trocarAbaModal('login')">Entrar</button>
            <button class="modal-tab" id="tabCadastroBtn" onclick="trocarAbaModal('cadastro')">Criar Conta</button>
        </div>

        <form id="formLoginModal" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="ex: alvaroafreu@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
            <button type="button" onclick="fecharModalAuth()" style="background: transparent; color: var(--text-muted); border: none; width: 100%; margin-top: 0.75rem; cursor: pointer; font-size: 0.85rem;">Cancelar</button>
        </form>

        <form id="formCadastroModal" onsubmit="realizarCadastro(event)" style="display: none;">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="cadNome" class="form-control" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="cadEmail" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="cadEndereco" class="form-control" placeholder="Rua Exemplo, 123" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="cadSenha" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Cadastrar Conta</button>
            <button type="button" onclick="fecharModalAuth()" style="background: transparent; color: var(--text-muted); border: none; width: 100%; margin-top: 0.75rem; cursor: pointer; font-size: 0.85rem;">Cancelar</button>
        </form>
    </div>
</div>

<!-- Main Container -->
<div class="main-container" id="produtos-section">
    <div id="appContainer"></div>
</div>

<!-- Detalhes do Produto -->
<div class="product-detail-view" id="productDetailView">
    <button class="btn-back" onclick="voltarParaLoja(event)"><i class="fa-solid fa-arrow-left"></i> Voltar para a loja</button>
    <div class="detail-container">
        <div class="detail-gallery">
            <div class="detail-main-image" id="detailMainImage"><i class="fa-solid fa-image"></i></div>
            <div class="detail-thumbnails">
                <div class="detail-thumb"><i class="fa-solid fa-image"></i></div>
                <div class="detail-thumb"><i class="fa-solid fa-image"></i></div>
            </div>
        </div>
        <div class="detail-info">
            <h1 class="detail-title" id="detailNome"></h1>
            <div class="detail-price" id="detailPreco"></div>
            <div class="detail-stock" id="detailEstoque"><i class="fa-solid fa-circle-check"></i> <span></span></div>
            <div class="detail-desc-title">Descrição do Produto</div>
            <div class="detail-desc" id="detailDescricao"></div>
            <button class="btn-buy-large">Adicionar ao Carrinho</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
